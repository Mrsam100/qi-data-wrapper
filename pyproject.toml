[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qi-data-wrapper"
version = "0.1.0"
description = "Local historical market-data validation, storage and serving service for QI"
# PyArrow 17–19 publishes supported wheels for Python 3.11–3.13.
# Keep local/runtime environments in this range instead of silently falling back to a source build.
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pyarrow>=17,<20",
  "duckdb>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
