services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qi_data_wrapper
      POSTGRES_USER: qi
      POSTGRES_PASSWORD: qi
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qi -d qi_data_wrapper"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - qi_data_postgres:/var/lib/postgresql/data

volumes:
  qi_data_postgres:

